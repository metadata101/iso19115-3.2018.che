name: CI

on:
  push:
    branches:
      - 4.4.9*

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

    - name: "Checking out"
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    - name: "Setup java JDK"
      uses: actions/setup-java@v4.2.1
      with:
        java-version: 11
        distribution: temurin
        java-package: jdk
        cache: maven

    - name: "Build gn 4.4.10"
      run: |
        cd core-geonetwork
        mvn clean install -DskipTests -Denforcer.skip

    - name: "Run test"
      run: |
        mvn clean install -U
